[package]
name         = "git-touchfish-commit"
version      = "0.3.2"
edition      = "2024"
rust-version = "1.85"
description  = "simple touchfish commit"
repository   = "https://github.com/lxl66566/git-touchfish-commit"
license      = "Unlicense"
keywords     = ["cli", "commit", "git"]
categories   = ["command-line-utilities", "development-tools"]

[[bin]]
name = "git-tc"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
rand   = "0.10"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all                     = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
doc_markdown            = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
pedantic                = { level = "warn", priority = -1 }
wildcard_imports        = "allow"

[lints.rust]
unsafe_code           = "allow"
unused_qualifications = "warn"

[profile.release]
opt-level = "s"
strip     = true
lto       = true
panic     = "abort"
